<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonlight Dynamics — 白月光吸引力动力学方程</title>
    <meta name="description" content="Moonlight Dynamics 是一个使用数学模型描述白月光心理变量对个体情绪动力学影响的交互式可视化项目。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ========================================= */
        /*  Design Tokens & Reset                    */
        /* ========================================= */
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
        }
        :root {
            --bg: #fafafa;
            --text-primary: #1a1a1a;
            --text-secondary: #5f6368;
            --accent-blue: #4285f4;
            --accent-red: #ea4335;
            --accent-yellow: #fbbc04;
            --accent-green: #34a853;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --accent-orange: #f97316;
            --btn-primary-bg: #1a1a1a;
            --btn-primary-text: #ffffff;
            --btn-secondary-bg: transparent;
            --btn-secondary-text: #1a1a1a;
            --btn-secondary-border: #dadce0;
        }

        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ========================================= */
        /*  Particle Canvas (full-screen background) */
        /* ========================================= */
        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ========================================= */
        /*  Navigation Bar                           */
        /* ========================================= */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            background: rgba(250, 250, 250, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: box-shadow 0.3s ease;
        }
        .navbar.scrolled {
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }
        .navbar-logo {
            width: 28px; height: 28px;
            position: relative;
        }
        .navbar-logo svg {
            width: 100%; height: 100%;
        }
        .navbar-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }
        .navbar-links a {
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
            position: relative;
        }
        .navbar-links a:hover {
            color: var(--text-primary);
        }
        .navbar-links a::after {
            content: '';
            position: absolute;
            bottom: -4px; left: 0;
            width: 0; height: 2px;
            background: var(--text-primary);
            transition: width 0.3s ease;
        }
        .navbar-links a:hover::after {
            width: 100%;
        }
        .nav-cta {
            padding: 8px 20px;
            background: var(--btn-primary-bg);
            color: var(--btn-primary-text) !important;
            border-radius: 24px;
            font-size: 13px !important;
            font-weight: 500;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .nav-cta::after { display: none !important; }
        .nav-cta:hover {
            background: #333;
            transform: translateY(-1px);
        }

        /* ========================================= */
        /*  Hero Section                             */
        /* ========================================= */
        .hero {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 120px 24px 80px;
        }

        /* Floating brand badge above headline */
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 32px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            animation: fadeInUp 0.8s ease both;
        }
        .hero-badge svg {
            width: 22px; height: 22px;
        }

        /* Main headline */
        .hero h1 {
            font-size: clamp(40px, 7vw, 72px);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -2px;
            max-width: 800px;
            margin-bottom: 28px;
            animation: fadeInUp 0.8s ease 0.15s both;

        .hero h1 .highlight {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

        /* Subtitle */
        .hero-subtitle {
            font-size: clamp(16px, 2.2vw, 20px);
            color: var(--text-secondary);
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 48px;
            font-weight: 400;
            animation: fadeInUp 0.8s ease 0.3s both;
        }

        /* CTA buttons row */
        .hero-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 0.8s ease 0.45s both;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 28px;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            outline: none;
            user-select: none;
        }
        .btn-primary {
            background: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        .btn-primary:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.2);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-primary svg {
            width: 18px; height: 18px;
        }
        .btn-secondary {
            background: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            border: 1.5px solid var(--btn-secondary-border);
        }
        .btn-secondary:hover {
            background: rgba(0,0,0,0.04);
            border-color: #bbb;
            transform: translateY(-2px);
        }
        .btn-secondary:active {
            transform: translateY(0);
        }
        .btn-secondary svg {
            width: 18px; height: 18px;
        }

        /* Version badge at the bottom of hero */
        .version-badge {
            margin-top: 64px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            background: rgba(0,0,0,0.04);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            animation: fadeInUp 0.8s ease 0.6s both;
        }
        .version-badge .dot {
            width: 6px; height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse-dot 2s ease infinite;
        }

        /* ========================================= */
        /*  Footer                                   */
        /* ========================================= */
        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 32px 24px;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid rgba(0,0,0,0.06);
        }
        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .footer a:hover {
            color: var(--text-primary);
        }

        /* ========================================= */
        /*  Animations                               */
        /* ========================================= */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.4); }
        }

        /* ========================================= */
        /*  Responsive                               */
        /* ========================================= */
        @media (max-width: 768px) {
            .navbar {
                padding: 14px 20px;
            }
            .navbar-links {
                display: none; /* collapsed on mobile */
            }
            .hero {
                padding: 100px 20px 60px;
            }
            .hero h1 {
                letter-spacing: -1px;
            }
            .hero-actions {
                flex-direction: column;
                width: 100%;
                max-width: 320px;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>

    <!-- ===================== PARTICLE SYSTEM SCRIPT ===================== -->
    <script>
    (() => {
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        // ---- Particle configuration ----
        const COLORS = [
            '#4285f4', '#ea4335', '#fbbc04', '#34a853',  // Google palette
            '#a855f7', '#ec4899', '#06b6d4', '#f97316',  // Extended palette
            '#6366f1', '#14b8a6', '#f43f5e', '#8b5cf6',
        ];
        const SHAPES = ['circle', 'square', 'triangle', 'line', 'diamond'];
        const MAX_PARTICLES = 220;
        const SPAWN_RATE = 3;       // particles per frame when mouse moves
        const AMBIENT_RATE = 0.4;   // ambient spawn rate (particles/frame)

        let mouse = { x: -1000, y: -1000, moving: false };
        let particles = [];
        let animId;

        // ---- Resize canvas ----
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // ---- Mouse tracking ----
        let mouseTimer;
        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.moving = true;
            clearTimeout(mouseTimer);
            mouseTimer = setTimeout(() => { mouse.moving = false; }, 120);
        });
        document.addEventListener('mouseleave', () => {
            mouse.moving = false;
        });

        // ---- Particle class ----
        class Particle {
            constructor(x, y, ambient = false) {
                this.x = x;
                this.y = y;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                this.size = Math.random() * 6 + 2;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.06;
                this.life = 1.0;

                if (ambient) {
                    // Ambient particles: slow drift, long life
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 0.4 + 0.1;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.decay = Math.random() * 0.002 + 0.001;
                    this.gravity = 0.005 + Math.random() * 0.01;
                    this.size = Math.random() * 5 + 2;
                } else {
                    // Mouse-spawned: burst outward from cursor
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 2.5 + 0.5;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.decay = Math.random() * 0.008 + 0.004;
                    this.gravity = 0.02 + Math.random() * 0.03;
                }
            }

            update() {
                this.x += this.vx;
                this.vy += this.gravity;
                this.y += this.vy;
                this.vx *= 0.995;
                this.rotation += this.rotationSpeed;
                this.life -= this.decay;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life * 0.85;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;
                ctx.strokeStyle = this.color;

                const s = this.size;

                switch (this.shape) {
                    case 'circle':
                        ctx.beginPath();
                        ctx.arc(0, 0, s, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'square':
                        ctx.fillRect(-s, -s, s * 2, s * 2);
                        break;
                    case 'triangle':
                        ctx.beginPath();
                        ctx.moveTo(0, -s);
                        ctx.lineTo(-s, s);
                        ctx.lineTo(s, s);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    case 'line':
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(-s * 1.5, 0);
                        ctx.lineTo(s * 1.5, 0);
                        ctx.stroke();
                        break;
                    case 'diamond':
                        ctx.beginPath();
                        ctx.moveTo(0, -s * 1.2);
                        ctx.lineTo(s * 0.7, 0);
                        ctx.lineTo(0, s * 1.2);
                        ctx.lineTo(-s * 0.7, 0);
                        ctx.closePath();
                        ctx.fill();
                        break;
                }
                ctx.restore();
            }
        }

        // ---- Animation loop ----
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Spawn mouse-following particles
            if (mouse.moving && particles.length < MAX_PARTICLES) {
                for (let i = 0; i < SPAWN_RATE; i++) {
                    const offsetX = (Math.random() - 0.5) * 30;
                    const offsetY = (Math.random() - 0.5) * 30;
                    particles.push(new Particle(mouse.x + offsetX, mouse.y + offsetY, false));
                }
            }

            // Ambient particles (scattered across the page)
            if (Math.random() < AMBIENT_RATE && particles.length < MAX_PARTICLES) {
                const ax = Math.random() * canvas.width;
                const ay = Math.random() * canvas.height * 0.6; // top 60%
                particles.push(new Particle(ax, ay, true));
            }

            // Update & draw
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                // Remove dead particles or offscreen
                if (p.life <= 0 || p.y > canvas.height + 50) {
                    particles.splice(i, 1);
                }
            }

            animId = requestAnimationFrame(animate);
        }

        // ---- Seed initial ambient particles across the viewport ----
        function seedParticles() {
            for (let i = 0; i < 80; i++) {
                const p = new Particle(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    true
                );
                p.life = Math.random() * 0.6 + 0.3;
                particles.push(p);
            }
        }

        seedParticles();
        animate();

        // ---- Navbar scroll shadow ----
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            navbar.classList.toggle('scrolled', window.scrollY > 10);
        });
    })();
    </script>
